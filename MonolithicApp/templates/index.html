<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grade Checker</title>
    <style>{% include "style.css" %}</style>
</head>
<body>
<div class="page">
    <header class="site-header">
        <span class="brand-mark" aria-hidden="true">&#10003;</span>
        <span>Grade Checker</span>
    </header>
    <main>
        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">Your academic overview</p>
            <h1 id="page-title">A little clarity.<br>All your grades.</h1>
            <p class="subtitle">Your course results, in one simple view.</p>
        </section>
        <form class="panel lookup-panel" action="/get_grades" method="get">
            <h2 class="panel-heading">Find your grades</h2>
            <label for="student_id">Student ID</label>
            <div class="input-row">
                <input type="text" id="student_id" name="student_id" placeholder="Enter your student ID" aria-describedby="id-hint">
                <button type="submit">Check Grade <span aria-hidden="true">&rarr;</span></button>
            </div>
            <p class="helper" id="id-hint">Enter your student ID to view your course grades.</p>
        </form>
    </main>
    <footer class="site-footer">Grade Checker &middot; Your academic overview</footer>
</div>
</body>
</html>
